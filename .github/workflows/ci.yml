name: CI & Release

on:
  push:
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Arch Linux Container)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    # A cold build used to spend ~30 minutes in Verify and then keep running
    # invisibly. Cap the job so a stuck or unexpectedly slow runner fails
    # rather than burning credit.
    timeout-minutes: 45

    steps:
      # The base image has no git, and checkout has to happen before the
      # snapshot pin can run from the repository. Bootstrap only; the
      # toolchain itself is pinned by the next step.
      - name: Bootstrap git
        run: pacman -Sy --noconfirm --needed git

      - name: Checkout repository
        uses: actions/checkout@v4

      # One date pins Zig, the LLD it links, and the libc it links against.
      - name: Pin the Arch snapshot
        run: ./scripts/ci-setup

      # A cold GPUI release build is the expensive part of this job. Restore
      # downloads and compiled artifacts keyed by the lockfile, so only the
      # first run after a dependency change pays for a full compile. The
      # release target is cached because `verify` no longer builds debug.
      - name: Cache Cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Calix.Ui.Gpui/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Rust release target
        uses: actions/cache@v4
        with:
          path: Calix.Ui.Gpui/target
          key: ${{ runner.os }}-rust-target-${{ hashFiles('Calix.Ui.Gpui/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-target-

      - name: Cache Zig compilation
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-zig-${{ hashFiles('Calix.Cli.Zig/build.zig.zon', 'Calix.PackageManager/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-zig-

      # Compile, test and smoke exactly what `scripts/verify` checks, so a
      # local pass and a CI pass cannot mean different things.
      - name: Verify
        timeout-minutes: 35
        run: ./scripts/verify

      - name: Prepare Release Artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist/usr/bin dist/usr/lib/calix dist/usr/lib/systemd/user dist/usr/share/applications dist/usr/share/icons/hicolor/scalable/apps dist/usr/share/polkit-1/actions

          # Binaires
          install -Dm755 Calix.Cli.Zig/zig-out/bin/calix dist/usr/lib/calix/calix
          install -Dm755 Calix.Cli.Zig/zig-out/bin/calix-daemon dist/usr/lib/calix/calix-daemon
          install -Dm755 Calix.Ui.Gpui/target/release/calix-gpui dist/usr/lib/calix/calix-gpui

          ln -s /usr/lib/calix/calix dist/usr/bin/calix
          ln -s /usr/lib/calix/calix-daemon dist/usr/bin/calix-daemon

          cat > dist/usr/bin/calix-gpui << 'EOF'
          #!/bin/sh
          CALIX_BIN=/usr/lib/calix/calix exec /usr/lib/calix/calix-gpui "$@"
          EOF
          chmod 755 dist/usr/bin/calix-gpui

          # Intégration bureau
          install -Dm644 Calix.Ui.Gpui/assets/live.gnu6.calix.desktop dist/usr/share/applications/
          install -Dm644 Calix.Ui.Gpui/assets/live.gnu6.calix.svg dist/usr/share/icons/hicolor/scalable/apps/
          install -Dm644 Calix.Ui.Gpui/assets/live.gnu6.calix.policy dist/usr/share/polkit-1/actions/
          install -Dm644 packaging/systemd/calix-daemon.service dist/usr/lib/systemd/user/calix-daemon.service

          cd dist
          tar -czvf ../calix-gpui-linux-x86_64.tar.gz usr/

      - name: Upload Binary Artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: calix-gpui-linux-x86_64
          path: calix-gpui-linux-x86_64.tar.gz

  release:
    name: GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: calix-gpui-linux-x86_64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: calix-gpui-linux-x86_64.tar.gz
          generate_release_notes: true
