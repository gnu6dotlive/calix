name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm zig flatpak base-devel gtk4 clang glibc git gettext libarchive curl vala meson ninja json-glib ripgrep

      # Checkout only after git is installed in the container.
      - uses: actions/checkout@v6

      - name: Build and test Flatpak backend
        run: |
          (cd Calix.Flatpak.Backend && zig build \
            --prefix ../publish/build-flatpak-backend \
            -Dcpu=baseline \
            -Doptimize=ReleaseSafe)
          (cd Calix.Flatpak.Backend && zig build test)
          (cd Calix.Flatpak.Backend && zig build abi-test)
          (cd Calix.Flatpak.Backend && zig build integration-test)

      - name: Test shared diagnostics
        run: cd Calix.Diagnostics && zig build test

      - name: Test HTTP client
        run: cd Calix.Http && zig build test

      - name: Test PackageManager
        run: |
          (cd Calix.PackageManager && zig build test)
          (cd Calix.PackageManager && zig build flatpak-test)

      - name: Publish Flatpak backend
        run: |
          mkdir -p publish/calix-flatpak-backend
          install -Dm755 \
            publish/build-flatpak-backend/lib/libcalix-flatpak-backend.so.1.0.0 \
            publish/calix-flatpak-backend/libcalix-flatpak-backend.so.1.0.0
          ln -s libcalix-flatpak-backend.so.1.0.0 \
            publish/calix-flatpak-backend/libcalix-flatpak-backend.so.1
          tar -czf publish/Calix-Flatpak-Backend-linux-x64.tar.gz \
            -C publish/calix-flatpak-backend .

      - name: Publish Calix.Cli
        run: |
          mkdir -p publish/calix-cli
          (cd Calix.Cli.Zig && zig build --prefix ../publish/build-cli -Dcpu=baseline -Doptimize=ReleaseSmall)
          (cd Calix.Cli.Zig && zig build test)
          install -Dm755 publish/build-cli/bin/calix publish/calix-cli/calix
          # Generate completion scripts from the freshly built binary.
          publish/calix-cli/calix utility --completions fish > publish/calix-cli/calix.fish
          publish/calix-cli/calix utility --completions zsh  > publish/calix-cli/_calix
          tar -czf publish/Calix-CLI-linux-x64.tar.gz -C publish/calix-cli .

      - name: Verify optional Flatpak boundary
        run: |
          scripts/check-flatpak-separation.sh \
            publish/calix-cli/calix \
            publish/calix-flatpak-backend/libcalix-flatpak-backend.so.1

      - name: Test TUI consumer
        run: |
          cd Calix.Tui
          zig build
          zig build test

      - name: Publish Calix.Gtk
        run: |
          mkdir -p publish/calix-ui
          (cd Calix.Ui.Gtk && zig build --prefix ../publish/build-ui -Dflatpak-backend-package=calix-flatpak-backend-bin -Dcpu=baseline -Doptimize=ReleaseSafe)
          install -Dm755 publish/build-ui/bin/Calix_Ui_Gtk publish/calix-ui/calix-ui
          install -m644 assets/calixlogo.png publish/calix-ui/
          install -m644 assets/calixlogo-tray.png publish/calix-ui/
          install -m644 assets/calixlogo-update.png publish/calix-ui/
          # Also bundle the CLI binary for convenience.
          install -m755 publish/calix-cli/calix publish/calix-ui/

      - name: Compile and bundle translations
        run: |
          mkdir -p publish/calix-ui/locale
          for po_file in Calix.Ui.Gtk/po/*.po; do
            if [ -f "$po_file" ]; then
              lang=$(basename "$po_file" .po)
              mkdir -p "publish/calix-ui/locale/$lang/LC_MESSAGES"
              msgfmt "$po_file" -o "publish/calix-ui/locale/$lang/LC_MESSAGES/calix-ui.mo"
            fi
          done

      - name: Compile and bundle tray service translations
        run: |
          mkdir -p publish/calix-ui/locale
          for po_file in Calix.Notifications.Zig/po/*.po; do
            if [ -f "$po_file" ]; then
              lang=$(basename "$po_file" .po)
              mkdir -p "publish/calix-ui/locale/$lang/LC_MESSAGES"
              msgfmt "$po_file" -o "publish/calix-ui/locale/$lang/LC_MESSAGES/calix-notifications.mo"
            fi
          done

      - name: Publish Calix.Notifications.Zig
        run: |
          (cd Calix.Notifications.Zig && zig build --verbose \
            --prefix ../publish/build-notifications \
            -Dcpu=baseline \
            -Doptimize=ReleaseSafe)
          # Bundle Notifications into the UI directory.
          install -Dm755 publish/build-notifications/bin/calix-notifications publish/calix-ui/calix-notifications

      - name: Publish Calix.Key
        run: |
          mkdir -p publish/calix-key
          (cd Calix.Key && zig build --prefix ../publish/build-key -Dcpu=baseline -Doptimize=ReleaseSmall)
          install -Dm755 publish/build-key/bin/calix-key publish/calix-key/calix-key
          # Bundle Key into the UI directory so it ends up in Calix-ALPM-linux-x64.tar.gz.
          install -m755 publish/calix-key/calix-key publish/calix-ui/

      - name: Package Calix.Key standalone
        run: |
          tar -czf publish/Calix-Key-linux-x64.tar.gz -C publish/calix-key .

      - name: Bundle Calix-ALPM
        run: |
          cp publish/calix-cli/calix.fish publish/calix-ui/
          cp publish/calix-cli/_calix     publish/calix-ui/
          tar -czf publish/Calix-ALPM-linux-x64.tar.gz -C publish/calix-ui .

      - name: Copy standalone release files
        run: |
          cp publish/calix-cli/calix.fish publish/calix.fish
          cp publish/calix-cli/_calix     publish/_calix
          cp calixbuild.conf publish/calixbuild.conf

      - name: Generate SHA256 checksums
        run: |
          cd publish
          # Download the source tarball from GitHub and generate its checksum.
          VERSION=${GITHUB_REF#refs/tags/}
          curl -sL "https://github.com/ZoeyErinBauer/Calix-ALPM/archive/${VERSION}.tar.gz" -o "source-${VERSION}.tar.gz"
          sha256sum "source-${VERSION}.tar.gz" | sed "s/source-${VERSION}.tar.gz/${VERSION}.tar.gz/" > SHA256SUMS.txt
          # Add binary tarballs, completions, and builder configuration checksums.
          sha256sum Calix-ALPM-linux-x64.tar.gz Calix-CLI-linux-x64.tar.gz Calix-Flatpak-Backend-linux-x64.tar.gz Calix-Key-linux-x64.tar.gz calix.fish _calix calixbuild.conf >> SHA256SUMS.txt
          rm "source-${VERSION}.tar.gz"
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            publish/Calix-ALPM-linux-x64.tar.gz
            publish/Calix-CLI-linux-x64.tar.gz
            publish/Calix-Flatpak-Backend-linux-x64.tar.gz
            publish/Calix-Key-linux-x64.tar.gz
            publish/calix.fish
            publish/_calix
            publish/calixbuild.conf
            publish/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Seafoam Labs website
        uses: digitalocean/app_action/deploy@v2
        with:
          app_name: seafoam-labs-website
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
