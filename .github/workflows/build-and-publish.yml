name: Build and Test
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master, development ]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      http: ${{ steps.filter.outputs.http }}
      packagemanager: ${{ steps.filter.outputs.packagemanager }}
      cli: ${{ steps.filter.outputs.cli }}
      gtk: ${{ steps.filter.outputs.gtk }}
      tui: ${{ steps.filter.outputs.tui }}
      key: ${{ steps.filter.outputs.key }}
      notifications: ${{ steps.filter.outputs.notifications }}
      pkgbuild: ${{ steps.filter.outputs.pkgbuild }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'Calix.Flatpak.Backend/**'
              - 'Calix.Diagnostics/**'
            http:
              - 'Calix.Http/**'
            packagemanager:
              - 'Calix.PackageManager/**'
              - 'Calix.Diagnostics/**'
            cli:
              - 'Calix.Cli.Zig/**'
              - 'Calix.Diagnostics/**'
              - 'Calix.PackageManager/**'
              - 'Calix.Flatpak.Backend/**'
              - 'scripts/**'
            gtk:
              - 'Calix.Ui.Gtk/**'
              - 'Calix.Diagnostics/**'
            tui:
              - 'Calix.Tui/**'
              - 'Calix.Diagnostics/**'
            key:
              - 'Calix.Key/**'
              - 'Calix.Diagnostics/**'
            notifications:
              - 'Calix.Notifications.Zig/**'
              - 'Calix.Diagnostics/**'
            pkgbuild:
              - 'PKGBUILD*'
              - '*.desktop'
              - 'calix-flatpak-integrate'

  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: archlinux:latest
    steps:
      - run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm zig flatpak base-devel glibc git libarchive
      - uses: actions/checkout@v6
      - name: Build and test Flatpak backend
        run: |
          cd Calix.Flatpak.Backend
          zig build
          zig build test
          zig build abi-test
          zig build integration-test

  http:
    needs: changes
    if: ${{ needs.changes.outputs.http == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: archlinux:latest
    steps:
      - run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm zig base-devel glibc git
      - uses: actions/checkout@v6
      - name: Build and test HTTP client
        run: |
          cd Calix.Http
          zig build
          zig build test

  packagemanager:
    needs: changes
    if: ${{ needs.changes.outputs.packagemanager == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: archlinux:latest
    steps:
      - run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm zig flatpak base-devel glibc git libarchive
      - uses: actions/checkout@v6
      - name: Build and test PackageManager
        run: |
          cd Calix.PackageManager
          zig build
          zig build test
          zig build flatpak-test

  cli:
    needs: changes
    if: ${{ needs.changes.outputs.cli == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: archlinux:latest
    steps:
      - run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm zig flatpak base-devel glibc git libarchive ripgrep
      - uses: actions/checkout@v6
      - name: Test shared diagnostics
        run: cd Calix.Diagnostics && zig build test
      - name: Build CLI and test
        run: |
          cd Calix.Cli.Zig
          zig build
          zig build test
      - name: Build backend for boundary check
        run: |
          cd Calix.Flatpak.Backend
          zig build
      - name: Verify optional Flatpak boundary
        run: |
          scripts/check-flatpak-separation.sh \
            Calix.Cli.Zig/zig-out/bin/calix \
            Calix.Flatpak.Backend/zig-out/lib/libcalix-flatpak-backend.so.1
          Calix.Cli.Zig/zig-out/bin/calix --help >/dev/null
          Calix.Cli.Zig/zig-out/bin/calix --version >/dev/null
          Calix.Cli.Zig/zig-out/bin/calix utility --completions bash >/dev/null

  gtk:
    needs: changes
    if: ${{ needs.changes.outputs.gtk == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: archlinux:latest
    steps:
      - run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm zig base-devel gtk4 glibc git vala xorg-server-xvfb xorg-xauth
      - uses: actions/checkout@v6
      - name: Build GTK GUI and test without a display
        run: |
          cd Calix.Ui.Gtk
          zig build
          env -u DISPLAY -u WAYLAND_DISPLAY zig build test
      - name: Test GTK widgets with a virtual display
        run: |
          cd Calix.Ui.Gtk
          GDK_BACKEND=x11 GSK_RENDERER=cairo GTK_A11Y=none xvfb-run -a zig build test

  tui:
    needs: changes
    if: ${{ needs.changes.outputs.tui == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: archlinux:latest
    steps:
      - run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm zig base-devel glibc git
      - uses: actions/checkout@v6
      - name: Build TUI and test
        run: |
          cd Calix.Tui
          zig build
          zig build test

  key:
    needs: changes
    if: ${{ needs.changes.outputs.key == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: archlinux:latest
    steps:
      - run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm zig base-devel glibc git
      - uses: actions/checkout@v6
      - name: Build keys & test
        run: |
          cd Calix.Key
          zig build
          zig build test

  notifications:
    needs: changes
    if: ${{ needs.changes.outputs.notifications == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: archlinux:latest
    steps:
      - run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm base-devel glibc git zig clang gettext
      - uses: actions/checkout@v6
      - name: Build Calix.Notifications.Zig
        run: |
          cd Calix.Notifications.Zig
          zig build --verbose \
            --prefix ../zig-out-notifications \
            -Dcpu=baseline \
            -Doptimize=ReleaseSafe

  pkgbuild:
    needs: changes
    if: ${{ needs.changes.outputs.pkgbuild == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm desktop-file-utils
      - uses: actions/checkout@v6
      - name: Validate Arch package recipes
        run: bash -n PKGBUILD PKGBUILD-git PKGBUILD-bin PKGBUILD-cli
      - name: Validate packaged desktop entries
        run: |
          desktop-file-validate com.calixorg.calix.desktop com.calixorg.calix-notifications.desktop
          bash -n calix-flatpak-integrate

  all-pass:
    if: ${{ always() }}
    needs:
      - backend
      - http
      - packagemanager
      - cli
      - gtk
      - tui
      - key
      - notifications
      - pkgbuild
    runs-on: ubuntu-latest
    steps:
      - name: Verify no job failed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "A required job failed or was cancelled."
              exit 1
            fi
          done
          echo "All triggered jobs passed (skipped jobs are OK)."
