name: "🐛 Bug Report"
description: Report a bug to help us improve Calix
title: "[Bug]: "
labels: ["bug"]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-flight Checklist
      description: Please confirm the following before submitting
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I have verified the issue is reproducible on the latest commit/release of Calix.
          required: true

  - type: input
    id: version
    attributes:
      label: Calix version or commit
      placeholder: e.g. v0.1.0 or git commit hash
    validations:
      required: true

  - type: checkboxes
    id: component
    attributes:
      label: Affected Component
      options:
        - label: Calix UI (GPUI Rust frontend)
        - label: Zig backend CLI (currently installed as `calix`)
        - label: Package Inspector / Details View
        - label: Live Search / Input
        - label: Terminal Log Drawer
        - label: Packaging (PKGBUILD / AUR)

  - type: textarea
    id: system-info
    attributes:
      label: System & Graphics Information
      description: Distribution, Desktop Environment, Display Server, GPU
      placeholder: |
        - OS / Distribution: [e.g. Arch Linux, EndeavourOS, CachyOS]
        - Display Server: [Wayland or X11]
        - Desktop Environment: [e.g. Hyprland, GNOME 47, KDE Plasma 6]
        - GPU / Drivers: [e.g. AMD Radeon RX 7900 (Mesa RADV), NVIDIA 560 Proprietary, Intel Xe]
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps needed to trigger the issue.
      placeholder: |
        1. Open Calix
        2. Click on ...
        3. Type ...
        4. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Terminal Output
      description: Run `RUST_LOG=debug calix-gpui` or paste logs from the terminal drawer.
      render: shell
