<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN"
  "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<!--
  Shelly GPUI — Application Icon
  Style: Catppuccin Mocha palette, flat design
  Size: scalable (viewBox 0 0 128 128)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Fond principal dégradé — Catppuccin Mocha Mantle → Base -->
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>

    <!-- Éclat accent — Blue Catppuccin -->
    <radialGradient id="bolt_glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%"   stop-color="#89b4fa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0"/>
    </radialGradient>

    <!-- Ombre portée légère -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3"
                    flood-color="#11111b" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- ── Fond arrondi ──────────────────────────────────────────────────── -->
  <rect width="128" height="128" rx="22" ry="22" fill="url(#bg_grad)"/>

  <!-- Bordure subtile Surface0 -->
  <rect width="128" height="128" rx="22" ry="22"
        fill="none" stroke="#313244" stroke-width="2"/>

  <!-- ── Halo d'accent derrière l'éclair ──────────────────────────────── -->
  <ellipse cx="64" cy="58" rx="38" ry="38" fill="url(#bolt_glow)"/>

  <!-- ── Éclair ⚡ (Lightning bolt) ───────────────────────────────────── -->
  <!--
      Forme : polygone éclair stylisé
      Couleur principale : Blue Lavender #89b4fa
      Surbrillance : Lavender #b4befe sur bord gauche supérieur
  -->
  <g filter="url(#shadow)">
    <!-- Corps principal de l'éclair -->
    <polygon
      points="72,16  44,68  62,68  56,112  84,60  66,60"
      fill="#89b4fa"/>

    <!-- Reflet / bord clair gauche -->
    <polygon
      points="72,16  44,68  55,68  68,28"
      fill="#b4befe" opacity="0.75"/>

    <!-- Ombre interne droite pour donner du volume -->
    <polygon
      points="62,68  56,112  74,76  66,68"
      fill="#7aa2f7" opacity="0.60"/>
  </g>

  <!-- ── Barre de progression stylisée (3 pixels en bas) ──────────────── -->
  <!-- Rappelle le terminal / log drawer de l'UI -->
  <g opacity="0.55">
    <rect x="20" y="112" width="28" height="4" rx="2" fill="#89b4fa"/>
    <rect x="52" y="112" width="16" height="4" rx="2" fill="#313244"/>
    <rect x="72" y="112" width="36" height="4" rx="2" fill="#313244"/>
  </g>
</svg>
