[package]
name = "calix-gpui"
version = "0.2.4"
edition = "2021"
authors = ["Tension Atoi", "Seafoam Labs"]
description = "High-performance GPU-accelerated package manager frontend for Calix and Arch Linux"
license = "GPL-3.0-only"

[dependencies]
gpui-pre = "0.3.9"
gpui-pre-platform = "0.3.9"
gpui-pre-linux = "0.3.9"
blade-graphics = "0.6"
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
image = "0.25"
futures = "0.3"
log = "0.4"
env_logger = "0.11"
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
libc = "0.2"

[dev-dependencies]
# The test harness of gpui: it lets a test draw a real view and simulate a
# real wheel, so the smooth scroll is proven and not asserted.
gpui-pre = { version = "0.3.9", features = ["test-support"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[workspace]
