[package]
name = "calix-gpui"
version = "0.2.4"
edition = "2021"
authors = ["Tension Atoi", "Seafoam Labs"]
description = "High-performance GPU-accelerated package manager frontend for Calix and Arch Linux"
license = "GPL-3.0-only"

[dependencies]
# The Wayland backend's `log` feature compiles the C shim that provides
# `wl_log_trampoline_to_rust_client` — the symbol the backend references
# when it hands the log handler to the Rust client. Without the shim, the
# link expects the *system* libwayland to export that symbol, and Arch's
# does not (it is the Rust-client support, not the library version).
#
# Cargo 1.98 turns the feature on by itself, through gpui-pre-linux; 1.97
# does not. The feature is declared here so that the build does not depend
# on the resolver's mood.
wayland-backend = { version = "0.3", features = ["log"] }
gpui-pre = "0.3.9"
gpui-pre-platform = "0.3.9"
gpui-pre-linux = "0.3.9"
blade-graphics = "0.6"
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
image = "0.25"
futures = "0.3"
log = "0.4"
env_logger = "0.11"
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
libc = "0.2"

[dev-dependencies]
# The test harness of gpui: it lets a test draw a real view and simulate a
# real wheel, so the smooth scroll is proven and not asserted.
gpui-pre = { version = "0.3.9", features = ["test-support"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[workspace]
