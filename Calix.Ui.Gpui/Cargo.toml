[package]
name = "calix-gpui"
version = "0.2.4"
edition = "2021"
authors = ["Tension Atoi", "Seafoam Labs"]
description = "High-performance GPU-accelerated package manager frontend for Calix and Arch Linux"
license = "GPL-3.0-only"

[dependencies]
gpui = "0.2.2"
blade-graphics = "=0.7.1"
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
image = "0.25"
futures = "0.3"
log = "0.4"
env_logger = "0.11"
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[workspace]
